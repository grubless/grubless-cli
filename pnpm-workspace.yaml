# A single-package repo, so this file exists only to carry settings — pnpm 11
# stopped reading the `pnpm` field in package.json.
#
# esbuild (pulled in by tsup and vitest) compiles a native binary in its
# postinstall, and pnpm blocks install scripts by default. Allowing it is build
# tooling only: nothing here reaches the published bundle, whose runtime
# dependency count is zero and is checked on every build by
# scripts/verify-bundle.mjs.
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild

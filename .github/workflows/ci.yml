name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Formatted
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # Vet for every OS the binary ships to: the TUI's resize handling and
      # the file-error mapping have per-OS code that only compiles there.
      - name: Vet
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
      # Everything, including the scenario recordings, the golden files, the
      # engine and dependency guards, and the TUI driven on a pseudo-terminal.
      # The e2e tier skips itself without GRUBLESS_E2E_API_URL, deliberately:
      # standing up a Grubless stack here would be testing the server. It runs
      # against a real deployment before a release — see README.md § Tests.
      - name: Test
        run: go test ./...

  build:
    # A static binary for every target, from one runner, with no C toolchain:
    # that's the portability the Go build exists for, so it's checked on every
    # change rather than discovered at release time.
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out=dist/grubless-$GOOS-$GOARCH${{ matrix.ext }}
          go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/grubless
          ls -l "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: grubless-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
